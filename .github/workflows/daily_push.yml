name: Daily Quote Push

on:
  schedule:
    # 北京时间 8:00, 12:00, 18:00
    - cron: '10 22,3,10 * * *'
  workflow_dispatch:

# 必须加这个，允许 Action 修改仓库文件
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        # 👇 关键修改：直接从 GitHub 安装最新开发版，解决 401 问题
        # pip install git+https://github.com/rany2/edge-tts.git
        
        # 👇 强制安装最新版 edge-tts 以解决 401 错误
        # pip install --force-reinstall "edge-tts>=6.1.9"
        # pip install git+https://github.com/rany2/edge-tts.git@master
        
    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        INPUT_BOT_TOKEN: ${{ secrets.INPUT_BOT_TOKEN }}
      run: python main.py

    # 新增步骤：把 Python 修改后的 txt 文件提交回仓库
    - name: Commit and Push changes
      run: |
        # 配置 git 用户（用 GitHub Actions bot 的身份）
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 添加所有变动
        git add .
        
        # 如果没有变化，直接退出，不报错
        git diff-index --quiet HEAD || git commit -m "Update [skip ci]"
        
        # 关键：先拉取最新代码并变基，解决潜在冲突
        git pull --rebase origin main
        
        # 推送
        git push
